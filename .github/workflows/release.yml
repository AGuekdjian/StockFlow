name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
  packages: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: version
        name: Read product version
        run: echo "value=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
      - id: tag
        name: Check whether release already exists
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.tag.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3
      - if: steps.tag.outputs.exists == 'false'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.tag.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ghcr.io/aguekdjian/stockflow-backend:${{ steps.version.outputs.value }}
            ghcr.io/aguekdjian/stockflow-backend:latest
            ghcr.io/aguekdjian/stockflow-backend:${{ github.event.workflow_run.head_sha }}
      - if: steps.tag.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          tags: |
            ghcr.io/aguekdjian/stockflow-frontend:${{ steps.version.outputs.value }}
            ghcr.io/aguekdjian/stockflow-frontend:latest
            ghcr.io/aguekdjian/stockflow-frontend:${{ github.event.workflow_run.head_sha }}
      - if: steps.tag.outputs.exists == 'false'
        name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.version.outputs.value }}
        run: >-
          gh release create "v$VERSION" --target "$RELEASE_SHA"
          --title "StockFlow $VERSION" --generate-notes

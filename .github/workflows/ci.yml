name: CI
on: [push, pull_request]
permissions:
  contents: read
  packages: write
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Validate PowerShell scripts
        shell: pwsh
        run: ./scripts/test-powershell.ps1
      - run: npm run test
      - run: npm run test:coverage
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: cp .env.example .env
      - run: docker compose config
      - run: docker compose build
  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ghcr.io/aguekdjian/stockflow-backend:latest
            ghcr.io/aguekdjian/stockflow-backend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          tags: |
            ghcr.io/aguekdjian/stockflow-frontend:latest
            ghcr.io/aguekdjian/stockflow-frontend:${{ github.sha }}

services:
  backend:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    env_file: .env
    environment:
      PORT: 3000
      SQLITE_PATH: /app/data/outbox.sqlite
      LOG_PATH: /app/logs
      BACKUP_PATH: /app/backups
    ports: ['${BACKEND_PORT:-3000}:3000']
    volumes:
      [
        'sqlite-data:/app/data',
        'application-logs:/app/logs',
        '${HOST_BACKUP_PATH:-./backups}:/app/backups',
      ]
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    ports: ['${FRONTEND_PORT:-8080}:80']
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  sqlite-data:
  application-logs:
